# GitHub Actions - Automated API Tests
# Runs REST Assured and TestNG tests using Maven

name: API Tests

on:
  push:
    branches:
      - feature/api-automation
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: api-tests/pom.xml

      - name: Run REST Assured API tests
        working-directory: api-tests
        run: mvn --batch-mode clean test
